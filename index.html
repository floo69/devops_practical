<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Code Display</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #333;
        }
        .code-container {
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 20px;
            margin: 20px auto;
            max-width: 600px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        pre {
            text-align: left;
            background-color: #f4f4f4;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
        }
        code {
            font-family: 'Courier New', monospace;
            color: #d63384;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Simple Code Example</h1>
    <div class="code-container">
        <p>Here's a simple JavaScript code snippet:</p>
        <pre><code>function greet(name) {
    console.log('Hello, ' + name + '!');
}

greet('World');</code></pre>
        <button onclick="runCode()">Run Code</button>
    </div>

    <script>
        function runCode() {
            alert('Code executed! Check the console for output.');
            console.log('Hello, World!');
        }
    </script>
</body>
</html>
